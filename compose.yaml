services:
  redis:
    image: redis:7-alpine
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
  minio:
    build: ./infra/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: permitflow
      MINIO_ROOT_PASSWORD: permitflow-local
    volumes:
      - minio-data:/data
  nifi:
    image: apache/nifi:2.6.0
    profiles: ["import"]
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: permitflow
      SINGLE_USER_CREDENTIALS_PASSWORD: permitflow-nifi-demo
      NIFI_WEB_PROXY_HOST: localhost:8443,127.0.0.1:8443
    volumes:
      - ./demo/import:/opt/permitflow/import
      - ./demo/normalize.groovy:/opt/permitflow/normalize.groovy:ro
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-flowfiles:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
    depends_on:
      kafka:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: permitflow
      POSTGRES_USER: permitflow
      POSTGRES_PASSWORD: permitflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "permitflow", "-d", "permitflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/permitflow
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/permitflow
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PERMITFLOW_MINIO_URL: http://minio:9000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
      minio:
        condition: service_started
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  minio-data:
  nifi-conf:
  nifi-state:
  nifi-flowfiles:
  nifi-content:
